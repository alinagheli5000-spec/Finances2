/* =====================================================================

const _persianFmt = new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', { year:'numeric', month:'numeric', day:'numeric' });
function todayJ(){ const parts = _persianFmt.formatToParts(new Date()); const g = t => +parts.find(p=>p.type===t).value; return [g('year'), g('month'), g('day')]; }
function _div(a,b){ return ~~(a/b); }
function jToG(jy, jm, jd){ let n = 0; for(let m = 1; m < jm; m++) n += (m <= 6) ? 31 : 30; n += jd; const epoch = Date.UTC(622, 2, 22); const jyDays = (jy - 1) * 365 + _div(jy, 4) - _div(jy, 100) + _div(jy, 400) - 1; const d = new Date(epoch + (jyDays + n - 1) * 86400000); return [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()]; }
function gToJ(gy, gm, gd){ const d = Date.UTC(gy, gm-1, gd); const epoch = Date.UTC(622, 2, 22); const gDays = Math.round((d - epoch) / 86400000) + 1; let jy = _div(gDays, 365) + 1, n = gDays; let jyDays = (jy - 1) * 365 + _div(jy, 4) - _div(jy, 100) + _div(jy, 400) - 1; while(n <= jyDays){ jy--; jyDays = (jy - 1) * 365 + _div(jy, 4) - _div(jy, 100) + _div(jy, 400) - 1; } while(n > jyDays + 365){ const nextDays = jy * 365 + _div(jy+1, 4) - _div(jy+1, 100) + _div(jy+1, 400) - 1; if(n > nextDays){ jy++; jyDays = nextDays; } else break; } n -= jyDays; let jm = 1; while(true){ const md = (jm <= 6) ? 31 : 30; if(n <= md) break; n -= md; jm++; } return [jy, jm, n]; }
function jMonthDays(y, m){ if(m <= 6) return 31; if(m <= 11) return 30; const [gy, gm, gd] = jToG(y, 12, 1); const next = new Date(Date.UTC(gy, gm - 1, gd + 30)); const [ny, nm] = gToJ(next.getUTCFullYear(), next.getUTCMonth() + 1, next.getUTCDate()); return (ny === y && nm === 1) ? 30 : 29; }
const dateStr = a => a[0] + '/' + pad(a[1]) + '/' + pad(a[2]);
const showDate = s => faDigits(s);
const longDate = s => { const [y,m,d]=s.split('/').map(Number); return faDigits(d)+' '+MONTHS[m-1]+' '+faDigits(y); };
function jAddDays(jy, jm, jd, delta){ const g = jToG(jy, jm, jd); const d = new Date(Date.UTC(g[0], g[1]-1, g[2])); d.setUTCDate(d.getUTCDate() + delta); return gToJ(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
function daysBetween(a, b){ const ga = jToG(a[0],a[1],a[2]); const gb = jToG(b[0],b[1],b[2]); return Math.round((Date.UTC(gb[0],gb[1]-1,gb[2]) - Date.UTC(ga[0],ga[1]-1,ga[2])) / 86400000); }
function dayOfWeek(jy, jm, jd){ const g = jToG(jy, jm, jd); const dow = new Date(Date.UTC(g[0], g[1]-1, g[2])).getUTCDay(); return (dow + 1) % 7; }

function buildDate(boxId, date, allowEmpty){
  const box = $(boxId); if(!box) return;
  const t = date || todayJ();
  let yOpts = allowEmpty ? '<option value="">—</option>' : '';
  for(let y = t[0]-30; y <= t[0]+2; y++) yOpts += `<option value="${y}">${faDigits(y)}</option>`;
  let mOpts = allowEmpty ? '<option value="">—</option>' : '';
  mOpts += MONTHS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  box.innerHTML = `<select data-r="y">${yOpts}</select><select data-r="m">${mOpts}</select><select data-r="d">${allowEmpty?'<option value="">—</option>':''}</select>`;
  const [sy,sm,sd] = ['y','m','d'].map(r=>box.querySelector(`[data-r=${r}]`));
  const fillDays = () => { const n = (+sy.value && +sm.value) ? jMonthDays(+sy.value,+sm.value) : 31; const cur = +sd.value || 1; let h = allowEmpty ? '<option value="">—</option>' : ''; for(let i=1;i<=n;i++) h += `<option value="${i}">${faDigits(i)}</option>`; sd.innerHTML = h; sd.value = Math.min(cur, n); };
  sy.onchange = sm.onchange = fillDays;
  if(date){ setDate(boxId, date); } else if(!allowEmpty){ setDate(boxId, t); } else { fillDays(); }
}
function setDate(boxId, arr){
  const box = $(boxId); if(!box) return;
  if(!arr){ ['y','m','d'].forEach(r=>{ box.querySelector(`[data-r=${r}]`).value = ''; }); return; }
  const [sy,sm,sd] = ['y','m','d'].map(r=>box.querySelector(`[data-r=${r}]`));
  sy.value = arr[0]; sm.value = arr[1];
  const n = jMonthDays(arr[0], arr[1]); let h = '';
  for(let i=1;i<=n;i++) h += `<option value="${i}">${faDigits(i)}</option>`;
  sd.innerHTML = h; sd.value = Math.min(arr[2], n);
}
function getDate(boxId){
  const box = $(boxId); if(!box) return null;
  const v = ['y','m','d'].map(r => box.querySelector(`[data-r=${r}]`).value);
  if(v.some(x => !x)) return null;
  return dateStr(v.map(Number));
}

function migrateOldData(){
  if(localStorage.getItem(CONFIG.LOCAL_KEY)) return;

async function pullFromCloud(){
  if(!sb) return false;
  setSync('syncing','همگام‌سازی…');
  try{
    const [stRes, txRes] = await Promise.all([ sb.from('students').select('*').order('created_at',{ascending:true}), sb.from('tx').select('*').order('date',{ascending:true}) ]);
    if(stRes.error) throw stRes.error;
    if(txRes.error) throw txRes.error;
    const cloudStudents = (stRes.data||[]).map(rowToStudent);
    const cloudTx = (txRes.data||[]).map(rowToTx);
    const cloudSIds = new Set(cloudStudents.map(s=>s.id));
    const cloudTxIds = new Set(cloudTx.map(t=>t.id));
    const localOnlyStudents = db.students.filter(s => !cloudSIds.has(s.id));
    const localOnlyTx = db.tx.filter(t => !cloudTxIds.has(t.id));
    db.students = [...cloudStudents, ...localOnlyStudents];
    db.tx = [...cloudTx, ...localOnlyTx];
    saveLocal();
    setSync('online','متصل');
    return true;
  }catch(e){ console.warn('pull error', e); setSync('offline','آفلاین'); return false; }
}

async function flushQueue(){
  if(!sb || !syncQueue.length) return;
  setSync('syncing','ارسال صف…');
  const remaining = [];
  for(const op of syncQueue){
    try{
      if(op.action === 'insert'){
        const { data, error } = await sb.from(op.table).insert([op.payload]).select().single();
        if(error) throw error;
        if(op.localId && data.id !== op.localId){
          const item = db[op.table].find(x=>x.id===op.localId);
          if(item) item.id = data.id;
          if(op.table === 'students') db.tx.forEach(t => { if(t.sid === op.localId) t.sid = data.id; });
          saveLocal();
        }
      } else if(op.action === 'update'){
        const { error } = await sb.from(op.table).update(op.payload).eq('id', op.id);
        if(error) throw error;
      } else if(op.action === 'delete'){
        const { error } = await sb.from(op.table).delete().eq('id', op.id);
        if(error) throw error;
      }
    }catch(e){ console.warn('queue op failed', op, e); remaining.push(op); }
  }
  syncQueue = remaining;
  saveQueue();
  if(syncQueue.length) setSync('offline', `صف: ${syncQueue.length}`);
  else setSync('online','متصل');
}

async function cloudInsert(table, payload, localId){
  if(!sb){ enqueue({action:'insert', table, payload, localId}); return; }
  try{
    const { data, error } = await sb.from(table).insert([payload]).select().single();
    if(error) throw error;
    if(localId && data.id !== localId){
      const item = db[table].find(x=>x.id===localId);
      if(item) item.id = data.id;
      if(table === 'students') db.tx.forEach(t => { if(t.sid === localId) t.sid = data.id; });
    }
    setSync('online','متصل');
  }catch(e){ console.warn(e); enqueue({action:'insert', table, payload, localId}); setSync('offline','آفلاین'); }
}
async function cloudUpdate(table, payload, id){
  if(!sb){ enqueue({action:'update', table, payload, id}); return; }
  try{ const { error } = await sb.from(table).update(payload).eq('id', id); if(error) throw error; setSync('online','متصل'); }
  catch(e){ console.warn(e); enqueue({action:'update', table, payload, id}); setSync('offline','آفلاین'); }
}
async function cloudDelete(table, id){
  if(!sb){ enqueue({action:'delete', table, id}); return; }
  try{ const { error } = await sb.from(table).delete().eq('id', id); if(error) throw error; setSync('online','متصل'); }
  catch(e){ console.warn(e); enqueue({action:'delete', table, id}); setSync('offline','آفلاین'); }
}

/* Animated count-up */
function animateValue(el, from, to, duration = 800){
  if(!el) return;
  const start = performance.now();
  const step = now => {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = Math.round(from + (to - from) * eased);
    el.textContent = fa(current);
    if(progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* Birthday helpers */
function isBirthdayToday(s){
  if(!s.birthday) return false;
  const [, m, d] = s.birthday.split('/').map(Number);
  const t = todayJ();
  return m === t[1] && d === t[2];
}
function birthdayThisMonth(s){
  if(!s.birthday) return false;
  const [, m] = s.birthday.split('/').map(Number);
  return m === todayJ()[1];
}
function birthdayInDays(s){
  if(!s.birthday) return null;
  const [, bm, bd] = s.birthday.split('/').map(Number);
  const t = todayJ();
  let target = [t[0], bm, bd];
  if(daysBetween(t, target) < 0) target = [t[0]+1, bm, bd];
  return daysBetween(t, target);
}

function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + t));
  renderAll();
  if(t !== 'calendar') window.scrollTo({top:0, behavior:'smooth'});
}

const globalSearch = $('globalSearch');
globalSearch.addEventListener('input', debounce(e => {

function renderDash(){
  // Greeting
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'صبح بخیر ☀️' : hour < 17 ? 'ظهر بخیر 🌤' : 'عصر بخیر 🌙';
  const b = balances();
  let debt = 0, nd = 0;
  db.students.forEach(s => { if(b[s.id].bal > 0){ debt += b[s.id].bal; nd++; } });
  $('dashGreeting').textContent = `${greet} — ${faDigits(nd)} زبان‌آموز بدهکار، مجموع ${fa(debt)} تومان`;

  // Stats
  let credit = 0, nc = 0, nz = 0;
  db.students.forEach(s => { const v = b[s.id].bal; if(v > 0){ nd++; } else if(v < 0){ credit += -v; nc++; } else nz++; });
  const income = db.tx.filter(t => t.type==='payment').reduce((a,t)=>a+t.amount,0);
  const exp = db.tx.filter(t => t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const sessionsCount = db.tx.filter(t => t.is_session).length;

  const t = todayJ();
  const thisMonthIncome = db.tx.filter(x => x.type==='payment' && x.date.startsWith(`${t[0]}/${pad(t[1])}`)).reduce((a,x)=>a+x.amount,0);
  let ly = t[0], lm = t[1] - 1; if(lm < 1){ lm = 12; ly--; }
  const lastMonthIncome = db.tx.filter(x => x.type==='payment' && x.date.startsWith(`${ly}/${pad(lm)}`)).reduce((a,x)=>a+x.amount,0);
  const monthDelta = lastMonthIncome > 0 ? Math.round((thisMonthIncome - lastMonthIncome) / lastMonthIncome * 100) : 0;

  const stats = [
    { label:'زبان‌آموزان', value:db.students.length, unit:'نفر', icon:ICON.users, color:'' },
    { label:'کل جلسات', value:sessionsCount, unit:'جلسه', icon:ICON.calendar, color:'purple' },
    { label:'کل درآمد', value:income, unit:'تومان', icon:ICON.income, color:'green' },
    { label:'مجموع بدهی', value:debt, unit:'تومان', icon:ICON.debt, color:'red' },
    { label:'بستانکاری', value:credit, unit:'تومان', icon:ICON.credit, color:'green' },
    { label:'هزینه‌ها', value:exp, unit:'تومان', icon:ICON.expense, color:'orange' },
    { label:'سود خالص', value:income-exp, unit:'تومان', icon:ICON.net, color:'' },
    { label:'درآمد این ماه', value:thisMonthIncome, unit:'تومان', icon:ICON.income, color:'green', delta: monthDelta }
  ];
  $('stats').innerHTML = stats.map(s => `
    <div class="stat">
      <div class="stat-icon ${s.color}">${s.icon}</div>
      <div class="stat-label">${s.label}</div>
      <div class="stat-value"><span class="count-up" data-target="${s.value}">${fa(s.value)}</span><small>${s.unit}</small></div>
      ${s.delta !== undefined && s.delta !== 0 ? `<div class="stat-delta ${s.delta>0?'up':'down'}">${s.delta>0?'▲':'▼'} ${faDigits(Math.abs(s.delta))}٪</div>` : ''}
    </div>
  `).join('');
  // animate count-up
  document.querySelectorAll('.count-up').forEach(el => {
    const target = Number(el.dataset.target) || 0;
    if(target > 0) animateValue(el, 0, target, 800);
  });

  renderBirthdayCard();
  renderOverdue();
  renderDonut(nd, nc, nz);
  renderBars(b);
  renderMonthlyChart();
  renderComparison();
  renderDaily();
  renderExpenseChart();
  renderAdvancedStats();
  renderRecent();
}

function renderOverdue(){
  const b = balances();
  const now = todayJ();
  const overdue = [];
  db.students.forEach(s => {
    const bal = b[s.id].bal;
    if(bal <= 0) return;
    const lastPay = db.tx.filter(t => t.sid===s.id && t.type==='payment').sort((a,b)=>b.date.localeCompare(a.date))[0];
    let daysSince = 999;
    if(lastPay){ const [py,pm,pd] = lastPay.date.split('/').map(Number); daysSince = daysBetween([py,pm,pd], now); }
    else {
      const fc = db.tx.filter(t => t.sid===s.id && t.type==='charge').sort((a,b)=>a.date.localeCompare(b.date))[0];
      if(fc){ const [cy,cm,cd] = fc.date.split('/').map(Number); daysSince = daysBetween([cy,cm,cd], now); }
    }
    if(daysSince >= 30) overdue.push({ student:s, bal, days:daysSince });
  });
  overdue.sort((a,b)=>b.bal - a.bal);
  const card = $('overdueCard');
  if(!overdue.length){ card.style.display = 'none'; return; }
  card.style.display = '';
  $('overdueCount').textContent = `(${faDigits(overdue.length)} نفر)`;
  $('overdueList').innerHTML = overdue.map(o => {
    const msg = `سلام ${o.student.name} عزیز، مبلغ ${fa(o.bal)} تومان بدهی کلاس زبان دارید. لطفاً تسویه کنید. — ${settings.smsAcademy}`;
    return `<div class="overdue-item">
      <div class="oi-info">
        <div class="oi-name">${esc(o.student.name)}</div>
        <div class="oi-meta">${o.days === 999 ? 'بدون پرداخت' : `${faDigits(o.days)} روز از آخرین پرداخت`} — ${esc(o.student.course||'—')}</div>
      </div>
      <div class="oi-amount">${fa(o.bal)} تومان</div>
      <div class="oi-actions">
        <button class="btn xs ghost" onclick="copyText('${msg.replace(/'/g,"\\'")}')">📋 کپی</button>
        ${o.student.phone ? `<button class="btn xs ghost" onclick="openSmsFor('${o.student.phone}','${msg.replace(/'/g,"\\'")}')">📱 SMS</button>` : ''}
        <button class="btn xs" onclick="quickTx('${o.student.id}','payment')">ثبت پرداخت</button>
      </div>
    </div>`;
  }).join('');
}
window.copyText = (text) => { navigator.clipboard.writeText(text).then(()=>toast('کپی شد', 'success')); };
window.openSmsFor = (phone, text) => { window.location.href = `sms:${phone}?&body=${encodeURIComponent(text)}`; };

function renderDonut(nd, nc, nz){
  const tot = nd+nc+nz, R = 42, C = 2*Math.PI*R;
  const parts = [[nd,'var(--rose)','بدهکار'],[nc,'var(--emerald)','بستانکار'],[nz,'var(--ink-3)','تسویه']];
  let off = 0, circ = '';
  if(tot){ parts.forEach(p => { if(!p[0]) return; const len = p[0]/tot*C; circ += `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${p[1]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)" stroke-linecap="round"/>`; off += len; }); }
  else circ = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--border)" stroke-width="16"/>`;
  $('donut').innerHTML = `<svg viewBox="0 0 120 120" width="170" height="170">${circ}<text x="60" y="56" text-anchor="middle" font-size="20" font-weight="800" style="fill:var(--ink)">${fa(tot)}</text><text x="60" y="74" text-anchor="middle" font-size="10" style="fill:var(--ink-2)">زبان‌آموز</text></svg><div class="donut-legend">${parts.map(p=>`<div class="item"><span class="dot" style="background:${p[1]}"></span>${p[2]}<b>${fa(p[0])}</b></div>`).join('')}</div>`;
}

function renderBars(b){
  const list = db.students.map(s=>({n:s.name, v:b[s.id].bal})).filter(x=>x.v!==0).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,10);
  const mx = Math.max(1, ...list.map(x=>Math.abs(x.v)));
  $('bars').innerHTML = list.length ? list.map(x=>`<div class="bar-row"><span class="bar-name" title="${esc(x.n)}">${esc(x.n)}</span><div class="bar-track"><div class="bar-fill ${x.v>0?'debt':'credit'}" style="width:${Math.abs(x.v)/mx*100}%"></div></div><span class="bar-val ${x.v>0?'neg':'pos'}">${fa(Math.abs(x.v))}</span></div>`).join('') : emptyState('همه تسویه');
}

function renderMonthlyChart(){
  const years = new Set([todayJ()[0]]);
  db.tx.forEach(t => years.add(+t.date.slice(0,4)));
  const sel = $('chartYear'), cur = sel.value || todayJ()[0];
  sel.innerHTML = [...years].sort((a,b)=>b-a).map(y=>`<option value="${y}">${faDigits(y)}</option>`).join('');
  sel.value = years.has(+cur) ? cur : todayJ()[0];
  const Y = sel.value, inc = Array(12).fill(0), ex = Array(12).fill(0);
  db.tx.forEach(t => { if(t.date.slice(0,4) !== String(Y)) return; const m = +t.date.slice(5,7)-1; if(t.type==='payment') inc[m] += t.amount; if(t.type==='expense') ex[m] += t.amount; });
  const W = 600, H = 250, pl = 10, pt = 14, pb = 34, cw = (W-pl*2)/12;
  const max = Math.max(1, ...inc, ...ex);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let i=0;i<=4;i++){ const y = pt+(H-pt-pb)*i/4; svg += `<line x1="${pl}" x2="${W-pl}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/>`; }
  for(let m=0;m<12;m++){
    const cx = W-pl-cw*(m+.5), bw = cw*.32, ch = H-pt-pb;
    const h1 = inc[m]/max*ch, h2 = ex[m]/max*ch;
    svg += `<rect x="${cx-bw-1}" y="${pt+ch-h1}" width="${bw}" height="${h1}" rx="4" fill="var(--emerald)"><title>${MONTHS[m]} - دریافتی: ${fa(inc[m])}</title></rect>`;
    svg += `<rect x="${cx+1}" y="${pt+ch-h2}" width="${bw}" height="${h2}" rx="4" fill="var(--coral)"><title>${MONTHS[m]} - هزینه: ${fa(ex[m])}</title></rect>`;
    svg += `<text x="${cx}" y="${H-14}" text-anchor="middle" font-size="10" style="fill:var(--ink-2)">${MONTHS[m]}</text>`;
    if(inc[m]) svg += `<text x="${cx-bw/2-1}" y="${pt+ch-h1-3}" text-anchor="middle" font-size="8" style="fill:var(--ink)">${fa(inc[m]/1000)}</text>`;
  }
  svg += '</svg>';
  $('monthly').innerHTML = svg;
  const ti = inc.reduce((a,b)=>a+b,0), te = ex.reduce((a,b)=>a+b,0);
  $('yearSum').textContent = `سال ${faDigits(Y)}: درآمد ${fa(ti)} | هزینه ${fa(te)} | سود ${fa(ti-te)} تومان`;
}

function renderComparison(){
  const t = todayJ();
  const data = [];
  for(let i = 5; i >= 0; i--){
    let y = t[0], m = t[1] - i;
    while(m < 1){ m += 12; y--; }
    const prefix = `${y}/${pad(m)}`;
    const income = db.tx.filter(x => x.type==='payment' && x.date.startsWith(prefix)).reduce((a,x)=>a+x.amount,0);
    data.push({ y, m, income });
  }
  const max = Math.max(1, ...data.map(d => d.income));
  const last = data[data.length-1], prev = data[data.length-2];
  const delta = prev && prev.income > 0 ? Math.round((last.income - prev.income) / prev.income * 100) : 0;
  $('comparison').innerHTML = `<div class="hint" style="margin-bottom:12px">${delta === 0 ? 'درآمد این ماه برابر ماه قبل' : delta > 0 ? `📈 درآمد این ماه <b style="color:var(--emerald)">${faDigits(delta)}٪</b> بیشتر` : `📉 درآمد این ماه <b style="color:var(--rose)">${faDigits(Math.abs(delta))}٪</b> کمتر`}</div>
    <div class="bars-list">${data.map(d => `<div class="bar-row"><span class="bar-name">${MONTHS[d.m-1]} ${faDigits(d.y)}</span><div class="bar-track" style="height:20px"><div class="bar-fill credit" style="width:${Math.max(3, d.income/max*100)}%;display:flex;align-items:center;justify-content:flex-end;padding-inline-end:6px;color:#fff;font-size:10px;font-weight:700">${d.income ? fa(d.income) : ''}</div></div><span class="bar-val">${fa(d.income)}</span></div>`).join('')}</div>`;
}

function renderDaily(){
  const years = new Set([todayJ()[0]]);
  db.tx.forEach(t => { if(t.date) years.add(+t.date.slice(0,4)); });
  const yearSel = $('dailyYear'), monthSel = $('dailyMonth');
  const curYear = yearSel.value || todayJ()[0];
  yearSel.innerHTML = [...years].sort((a,b)=>b-a).map(y => `<option value="${y}">${faDigits(y)}</option>`).join('');
  yearSel.value = years.has(+curYear) ? curYear : todayJ()[0];
  const curMonth = monthSel.value || todayJ()[1];
  monthSel.innerHTML = MONTHS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  monthSel.value = (+curMonth >= 1 && +curMonth <= 12) ? curMonth : todayJ()[1];
  const Y = +yearSel.value, M = +monthSel.value;
  const daysInMonth = jMonthDays(Y, M);
  const days = Array.from({length: daysInMonth}, (_,i) => ({ d: i+1, income:0, expense:0, count:0, txCount:0 }));
  db.tx.forEach(t => { if(!t.date) return; const [ty, tm, td] = t.date.split('/').map(Number); if(ty !== Y || tm !== M) return; const day = days[td - 1]; if(!day) return; if(t.type === 'payment'){ day.income += t.amount; day.txCount++; } if(t.type === 'expense'){ day.expense += t.amount; day.txCount++; } if(t.type === 'charge'){ day.count += t.amount; } });
  const totalIncome = days.reduce((a,d)=>a+d.income, 0);
  const totalExpense = days.reduce((a,d)=>a+d.expense, 0);
  const netIncome = totalIncome - totalExpense;
  const activeDays = days.filter(d => d.income > 0).length;
  const avgPerActive = activeDays ? Math.round(totalIncome / activeDays) : 0;
  const bestDay = days.reduce((best, d) => d.income > best.income ? d : best, days[0]);
  const bestDayLabel = bestDay && bestDay.income > 0 ? `${faDigits(bestDay.d)} ${MONTHS[M-1]}` : '—';
  $('dailySummary').innerHTML = `
    <div class="dsum gold"><small>کل درآمد ماه</small><b>${fa(totalIncome)}<small>تومان</small></b></div>
    <div class="dsum"><small>هزینه</small><b>${fa(totalExpense)}<small>تومان</small></b></div>
    <div class="dsum"><small>خالص</small><b class="${netIncome >= 0 ? 'pos' : 'neg'}">${fa(netIncome)}<small>تومان</small></b></div>
    <div class="dsum"><small>پردرآمدترین روز</small><b style="font-size:15px">${bestDayLabel}${bestDay && bestDay.income > 0 ? ` <small style="font-size:10px;color:var(--primary)">(${fa(bestDay.income)})</small>` : ''}</b></div>
    <div class="dsum"><small>میانگین روزهای فعال</small><b>${fa(avgPerActive)}<small>تومان</small></b></div>
  `;
  const W = Math.max(640, daysInMonth * 26), H = 240, pl = 10, pt = 20, pb = 30;
  const cw = (W - pl*2) / daysInMonth;
  const maxVal = Math.max(1, ...days.map(d => Math.max(d.income, d.expense)));
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${W}px">`;
  for(let i=0;i<=4;i++){ const y = pt + (H-pt-pb) * i/4; svg += `<line x1="${pl}" x2="${W-pl}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/>`; }
  for(let i=0;i<days.length;i++){
    const d = days[i];
    const cx = W - pl - cw*(i+.5), bw = cw*0.34, ch = H - pt - pb;
    const h1 = d.income / maxVal * ch, h2 = d.expense / maxVal * ch;
    svg += `<rect x="${cx-bw-1}" y="${pt+ch-h1}" width="${bw}" height="${h1}" rx="2" fill="var(--emerald)"><title>${faDigits(d.d)} ${MONTHS[M-1]} — درآمد: ${fa(d.income)}</title></rect>`;
    svg += `<rect x="${cx+1}" y="${pt+ch-h2}" width="${bw}" height="${h2}" rx="2" fill="var(--coral)"><title>${faDigits(d.d)} ${MONTHS[M-1]} — هزینه: ${fa(d.expense)}</title></rect>`;
    if(daysInMonth <= 15 || d.d === 1 || d.d % 5 === 0 || d.d === daysInMonth) svg += `<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="9" style="fill:var(--ink-2)">${faDigits(d.d)}</text>`;
  }
  svg += '</svg>';
  $('dailyChart').innerHTML = svg;
  const rows = days.map(d => {
    const isHighlight = bestDay && d.d === bestDay.d && d.income > 0;
    const isZero = d.income === 0 && d.expense === 0 && d.count === 0;
    const net = d.income - d.expense;
    return `<tr class="${isZero ? 'zero' : ''} ${isHighlight ? 'highlight' : ''}"><td class="day">${faDigits(d.d)} ${MONTHS[M-1]}</td><td class="n ${d.income > 0 ? 'pos' : ''}">${d.income ? fa(d.income) : '—'}</td><td class="n ${d.expense > 0 ? 'neg' : ''}">${d.expense ? fa(d.expense) : '—'}</td><td class="n ${net > 0 ? 'pos' : net < 0 ? 'neg' : ''}">${net !== 0 ? fa(Math.abs(net)) + (net > 0 ? ' +' : ' −') : '—'}</td><td class="n">${d.txCount ? faDigits(d.txCount) : '—'}</td><td>${d.count ? `<span class="tag debt">${fa(d.count)}</span>` : '—'}</td></tr>`;
  }).join('');
  $('dailyTable').innerHTML = `<table><thead><tr><th>روز</th><th>درآمد</th><th>هزینه</th><th>خالص</th><th>تراکنش</th><th>بدهی</th></tr></thead><tbody>${rows}</tbody></table>`;
  if(!yearSel._bound){ yearSel._bound = true; yearSel.addEventListener('change', renderDaily); monthSel.addEventListener('change', renderDaily); }
}

function renderExpenseChart(){
  const t = todayJ();
  const prefix = `${t[0]}/${pad(t[1])}`;
  const expenses = db.tx.filter(x => x.type==='expense' && x.date.startsWith(prefix));
  const byCat = {};
  expenses.forEach(e => { const c = e.category || 'other'; byCat[c] = (byCat[c] || 0) + e.amount; });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ $('expenseChart').innerHTML = emptyState('این ماه هزینه‌ای نیست'); return; }
  const total = entries.reduce((a,[k,v])=>a+v, 0);
  const R = 42, C = 2 * Math.PI * R;
  let off = 0, circ = '';
  entries.forEach(([cat, val]) => { const len = val / total * C; circ += `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${CAT_COLORS[cat]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)" stroke-linecap="round"/>`; off += len; });
  $('expenseChart').innerHTML = `<div class="donut-wrap"><svg viewBox="0 0 120 120" width="160" height="160">${circ}<text x="60" y="56" text-anchor="middle" font-size="14" font-weight="800" style="fill:var(--ink)">${fa(total)}</text><text x="60" y="72" text-anchor="middle" font-size="9" style="fill:var(--ink-2)">تومان</text></svg><div class="donut-legend">${entries.map(([cat,val]) => `<div class="item"><span class="dot" style="background:${CAT_COLORS[cat]}"></span>${EXPENSE_CATS[cat]}<b>${faDigits(Math.round(val/total*100))}٪</b></div>`).join('')}</div></div>`;
}

function renderAdvancedStats(){
  const t = todayJ();
  const b = balances();
  const paidCount = db.students.filter(s => b[s.id] && b[s.id].bal <= 0).length;
  const payRate = db.students.length ? Math.round(paidCount / db.students.length * 100) : 0;
  const totalIncome = db.tx.filter(x=>x.type==='payment').reduce((a,x)=>a+x.amount,0);
  const avgPerStudent = db.students.length ? Math.round(totalIncome / db.students.length) : 0;
  let total3 = 0;
  for(let i = 1; i <= 3; i++){
    let y = t[0], m = t[1] - i;
    while(m < 1){ m += 12; y--; }
    total3 += db.tx.filter(x => x.type==='payment' && x.date.startsWith(`${y}/${pad(m)}`)).reduce((a,x)=>a+x.amount,0);
  }
  const prediction = Math.round(total3 / 3);

    <div class="dsum"><small>نرخ تسویه</small><b>${faDigits(payRate)}٪</b><div class="hint" style="font-size:10.5px;margin-top:2px">${faDigits(paidCount)} از ${faDigits(db.students.length)}</div></div>

}

$('seSave').onclick = async () => {

  const date = getDate('seDate');

  const method = $('seMethod').value === '—' ? '' : $('seMethod').value;
  const tag = $('seTag').value.trim().replace(/^#/, '') || null;
  const created = [];
  for(const id of ids){
    const amount = +seSelected[id] || 0;
    const s = db.students.find(x=>x.id===id);
    if(amount <= 0 && !seAbsentMode){ toast(`مبلغ برای «${stName(id)}» صفر است`, 'err'); return; }
    let pkgUsed = s.package_used || 0;
    if(!seAbsentMode && (s.package_size||0) > 0 && pkgUsed < s.package_size){
      pkgUsed += 1;
      s.package_used = pkgUsed;
      await cloudUpdate('students', studentToRow(s), s.id);
    }
    const t = { id: uid(), ts: Date.now(), type: 'charge', sid: id, amount, date, method, desc: baseDesc ? `${baseDesc} — ${stName(id)}` : (seAbsentMode ? `غیبت ${showDate(date)}` : `جلسه ${showDate(date)}`), session_date: date, is_session: true, absent: seAbsentMode, tag, category: null };

  if(!sid){ toast('زبان‌آموز را انتخاب کن', 'err'); return; }
  if(size <= 0){ toast('تعداد جلسات را وارد کن', 'err'); return; }
  const s = db.students.find(x=>x.id===sid); if(!s) return;
  s.package_size = (s.package_size || 0) + size;
  s.package_used = s.package_used || 0;
  await cloudUpdate('students', studentToRow(s), s.id);
  saveLocal(); renderPkgs(); renderStudents();
  toast(`پکیج ${faDigits(size)} جلسه‌ای اضافه شد`, 'success');
  $('pkgSize').value = ''; $('pkgAmount').value = '';
};
function renderPkgs(){
  const tbody = db.students.map(s => {
    const total = s.package_size || 0, used = s.package_used || 0;
    const left = total - used;
    if(!total) return '';
    const pct = total ? Math.round(left / total * 100) : 0;
    return `<tr><td><b>${esc(s.name)}</b></td><td class="n">${faDigits(total)}</td><td class="n">${faDigits(used)}</td><td class="n ${left > 0 ? 'pos' : 'neg'}"><b>${faDigits(left)}</b></td><td style="min-width:120px"><div class="bar-track" style="height:8px"><div class="bar-fill ${left > 0 ? 'credit' : 'debt'}" style="width:${pct}%"></div></div></td><td><button class="btn xs ghost" onclick="resetPkg('${s.id}')">ریست</button></td></tr>`;
  }).filter(Boolean).join('');
  $('pkgTable').innerHTML = tbody ? `<table><thead><tr><th>زبان‌آموز</th><th>کل</th><th>استفاده</th><th>باقی</th><th>پیشرفت</th><th></th></tr></thead><tbody>${tbody}</tbody></table>` : emptyState('پکیجی تعریف نشده');
}
window.resetPkg = async (id) => {
  const s = db.students.find(x=>x.id===id); if(!s) return;
  if(!confirm('پکیج ریست شود؟')) return;
  s.package_size = 0; s.package_used = 0;
  await cloudUpdate('students', studentToRow(s), s.id);
  saveLocal(); renderPkgs(); renderStudents();
  toast('ریست شد', 'success');
};

function updateSmsPreview(type){
  const b = balances();
  let text = '', targetStudents = [];
  if(type === 'debt'){
    text = $('smsDebtText').value || '';
    targetStudents = [...smsSelectedDebt].map(id => ({ s: db.students.find(x=>x.id===id), amount: b[id]?.bal || 0 })).filter(x => x.s);
  } else if(type === 'birthday'){
    if(!smsSelectedBday.size){ db.students.filter(isBirthdayToday).forEach(s => smsSelectedBday.add(s.id)); }
    text = $('smsBdayText').value || '';
    targetStudents = [...smsSelectedBday].map(id => ({ s: db.students.find(x=>x.id===id), amount: 0 })).filter(x => x.s);
  } else {
    text = $('smsCustomText').value || '';
    targetStudents = [...smsSelectedCustom].map(id => ({ s: db.students.find(x=>x.id===id), amount: b[id]?.bal || 0 })).filter(x => x.s);
  }
  const sample = targetStudents[0] ? applySmsVars(text, targetStudents[0].s, targetStudents[0].amount) : text;
  const preview = $('sms' + type[0].toUpperCase() + type.slice(1) + 'Preview');
  if(preview) preview.textContent = sample || '—';
}

function applySmsVars(text, s, amount){
  return text
    .replace(/{name}/g, s ? s.name : '')
    .replace(/{amount}/g, fa(amount))
    .replace(/{academy}/g, settings.smsAcademy || 'آموزشگاه');
}

    if(id === 'smsBdayText') updateSmsPreview('birthday');

// ارسال
async function sendSms(type){
  const b = balances();
  let text = '', recipients = [];
  if(type === 'debt'){
    text = $('smsDebtText').value;
    recipients = [...smsSelectedDebt].map(id => ({ s: db.students.find(x=>x.id===id), amount: b[id]?.bal || 0 })).filter(x => x.s && x.s.phone);
  } else if(type === 'birthday'){
    if(!smsSelectedBday.size) db.students.filter(isBirthdayToday).forEach(s => smsSelectedBday.add(s.id));
    text = $('smsBdayText').value;
    recipients = [...smsSelectedBday].map(id => ({ s: db.students.find(x=>x.id===id), amount: 0 })).filter(x => x.s && x.s.phone);
  } else {
    text = $('smsCustomText').value;
    recipients = [...smsSelectedCustom].map(id => ({ s: db.students.find(x=>x.id===id), amount: b[id]?.bal || 0 })).filter(x => x.s && x.s.phone);
  }
  if(!recipients.length){ toast('هیچ گیرنده‌ای انتخاب نشده', 'err'); return; }
  if(settings.smsProvider === 'none'){
    if(confirm(`${faDigits(recipients.length)} پیام آماده است. می‌خواهی به‌جای ارسال خودکار، در اپ پیامک باز شوند؟ (تک‌تک باید بفرستی)`)){
      openSmsFallback(type);
    }
    return;
  }
  if(!settings.smsApiKey){ toast('API Key تنظیم نشده', 'err'); switchTab('settings'); return; }
  // ارسال از طریق Supabase Edge Function
  if(!sb){ toast('Supabase در دسترس نیست', 'err'); return; }
  let sent = 0, failed = 0;
  toast('در حال ارسال…', 'info');
  for(const r of recipients){
    const msg = applySmsVars(text, r.s, r.amount);
    try{
      const { data, error } = await sb.functions.invoke('send-sms', {
        body: { provider: settings.smsProvider, apiKey: settings.smsApiKey, sender: settings.smsSender, phone: r.s.phone, message: msg }
      });
      if(error || (data && data.error)) throw (error || new Error(data.error));
      sent++;
    }catch(e){ console.warn('send sms failed', e); failed++; }
  }
  toast(`ارسال شد: ${faDigits(sent)} موفق، ${faDigits(failed)} ناموفق`, sent ? 'success' : 'err');
}

window.openSmsFallback = (type) => {
  const b = balances();
  let text = '', recipients = [];
  if(type === 'debt'){
    text = $('smsDebtText').value;
    recipients = [...smsSelectedDebt].map(id => ({ s: db.students.find(x=>x.id===id), amount: b[id]?.bal || 0 })).filter(x => x.s && x.s.phone);
  } else if(type === 'birthday'){
    if(!smsSelectedBday.size) db.students.filter(isBirthdayToday).forEach(s => smsSelectedBday.add(s.id));
    text = $('smsBdayText').value;
    recipients = [...smsSelectedBday].map(id => ({ s: db.students.find(x=>x.id===id), amount: 0 })).filter(x => x.s && x.s.phone);
  } else {
    text = $('smsCustomText').value;
    recipients = [...smsSelectedCustom].map(id => ({ s: db.students.find(x=>x.id===id), amount: b[id]?.bal || 0 })).filter(x => x.s && x.s.phone);
  }
  if(!recipients.length){ toast('گیرنده‌ای انتخاب نشده', 'err'); return; }
  // فقط اولی
  const r = recipients[0];
  const msg = applySmsVars(text, r.s, r.amount);
  window.location.href = `sms:${r.s.phone}?&body=${encodeURIComponent(msg)}`;
  if(recipients.length > 1){ toast(`بقیه: ${recipients.slice(1).map(x=>x.s.name).join(', ')}`, 'info'); }
};

let calYear, calMonth;
function initCalendar(){
  const t = todayJ();
  calYear = t[0]; calMonth = t[1];
  $('calPrev').onclick = () => { calMonth--; if(calMonth < 1){ calMonth = 12; calYear--; } renderCalendar(); };
  $('calNext').onclick = () => { calMonth++; if(calMonth > 12){ calMonth = 1; calYear++; } renderCalendar(); };
  $('calToday').onclick = () => { calYear = t[0]; calMonth = t[1]; renderCalendar(); };
}
function renderCalendar(){
  const daysInMonth = jMonthDays(calYear, calMonth);
  const firstDay = dayOfWeek(calYear, calMonth, 1);
  $('calTitle').textContent = `${MONTHS[calMonth-1]} ${faDigits(calYear)}`;
  const t = todayJ();
  const days = Array.from({length: daysInMonth}, (_,i) => ({ d: i+1, income:0, expense:0, sessions:0, birthday:false }));
  db.tx.forEach(tx => {
    if(!tx.date) return;
    const [y,m,d] = tx.date.split('/').map(Number);
    if(y !== calYear || m !== calMonth) return;
    const day = days[d-1];
    if(!day) return;
    if(tx.type==='payment') day.income += tx.amount;
    if(tx.type==='expense') day.expense += tx.amount;
    if(tx.is_session) day.sessions += 1;
  });
  db.students.forEach(s => {
    if(!s.birthday) return;
    const [, bm, bd] = s.birthday.split('/').map(Number);
    if(bm === calMonth && days[bd-1]) days[bd-1].birthday = true;
  });
  const cells = [];
  for(let i = 0; i < firstDay; i++) cells.push(`<div class="cal-cell empty"></div>`);
  days.forEach(d => {
    const isToday = t[0]===calYear && t[1]===calMonth && t[2]===d.d;
    const hasIncome = d.income > 0;
    cells.push(`<div class="cal-cell ${isToday ? 'today' : ''} ${hasIncome ? 'has-income' : ''} ${d.birthday ? 'birthday' : ''}" onclick="showCalDay(${d.d})">
      <div class="cal-date">${faDigits(d.d)}</div>
      ${d.birthday ? `<div class="cal-bday">🎂</div>` : ''}
      ${d.income ? `<div class="cal-inc">▲ ${fa(d.income)}</div>` : ''}
      ${d.expense ? `<div class="cal-exp">▼ ${fa(d.expense)}</div>` : ''}
      ${d.sessions ? `<div class="cal-sessions">${faDigits(d.sessions)} جلسه</div>` : ''}
    </div>`);
  });
  const remainder = (7 - (cells.length % 7)) % 7;
  for(let i = 0; i < remainder; i++) cells.push(`<div class="cal-cell empty"></div>`);
  const header = WEEKDAYS.map(d => `<div class="cal-dayname">${d}</div>`).join('');
  $('calGrid').innerHTML = header + cells.join('');
}
window.showCalDay = (d) => {
  const dateStr_ = `${calYear}/${pad(calMonth)}/${pad(d)}`;
  const rows = db.tx.filter(t => t.date === dateStr_).sort((a,b)=>b.ts-a.ts);
  const bdays = db.students.filter(s => { if(!s.birthday) return false; const [,m,dd] = s.birthday.split('/').map(Number); return m === calMonth && dd === d; });
  $('calDayDetail').style.display = '';

   REPORT
   ===================================================================== */
function runReport(){
  const from = getDate('repFrom'), to = getDate('repTo');
  if(!from || !to) return;
  if(from > to){ toast('تاریخ شروع بعد از پایان است', 'err'); return; }
  const rows = db.tx.filter(t => { const d = t.is_session && t.session_date ? t.session_date : t.date; return d >= from && d <= to; });
  const income = rows.filter(t=>t.type==='payment').reduce((a,t)=>a+t.amount,0);
  const charge = rows.filter(t=>t.type==='charge').reduce((a,t)=>a+t.amount,0);
  const expense = rows.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const sessions = rows.filter(t=>t.is_session).length;
  const absentCount = rows.filter(t=>t.is_session && t.absent).length;
  const net = income - expense;
  let overdue = 0;
  db.tx.forEach(t => { const d = t.is_session && t.session_date ? t.session_date : t.date; if(d > to) return; if(t.type==='charge') overdue += t.amount; if(t.type==='payment') overdue -= t.amount; });
  $('repCards').innerHTML = `
    <div class="rep-card green"><small>درآمد</small><b>${fa(income)}<small>تومان</small></b></div>
    <div class="rep-card red"><small>بدهی ثبت‌شده</small><b>${fa(charge)}<small>تومان</small></b></div>
    <div class="rep-card purple"><small>جلسات (${faDigits(absentCount)} غایب)</small><b>${fa(sessions)}<small>جلسه</small></b></div>
    <div class="rep-card orange"><small>هزینه</small><b>${fa(expense)}<small>تومان</small></b></div>
    <div class="rep-card green"><small>سود خالص</small><b>${fa(net)}<small>تومان</small></b></div>
    <div class="rep-card red"><small>بدهی معوق</small><b>${fa(Math.max(0,overdue))}<small>تومان</small></b></div>`;
  $('repSummaryTxt').textContent = `از ${showDate(from)} تا ${showDate(to)} — ${faDigits(rows.length)} تراکنش`;
  const byStudent = {};
  db.students.forEach(s => byStudent[s.id] = { name:s.name, sessions:0, absent:0, charge:0, payment:0 });
  rows.forEach(t => { if(!byStudent[t.sid]) return; const o = byStudent[t.sid]; if(t.type==='charge'){ o.charge += t.amount; if(t.is_session){ o.sessions += 1; if(t.absent) o.absent += 1; } } if(t.type==='payment'){ o.payment += t.amount; } });
  const list = Object.values(byStudent).filter(x => x.charge || x.payment || x.sessions).sort((a,b)=> (b.charge + b.payment) - (a.charge + a.payment));
  $('repStudents').innerHTML = list.length ? `<table><thead><tr><th>زبان‌آموز</th><th>جلسات</th><th>غایب</th><th>بدهی</th><th>دریافتی</th><th>خالص</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="n">${fa(x.sessions)}</td><td class="n">${x.absent ? fa(x.absent) : '—'}</td><td class="n neg">${fa(x.charge)}</td><td class="n pos">${fa(x.payment)}</td><td class="n ${x.charge-x.payment>0?'neg':'pos'}">${fa(Math.abs(x.charge-x.payment))} ${x.charge-x.payment>0?'بدهکار':x.charge-x.payment<0?'بستانکار':''}</td></tr>`).join('')}</tbody></table>` : emptyState('تراکنشی نیست');
  const sortedRows = [...rows].sort((a,b)=>{ const da = a.is_session&&a.session_date ? a.session_date : a.date; const db_ = b.is_session&&b.session_date ? b.session_date : b.date; return db_.localeCompare(da) || b.ts - a.ts; });
  $('repTx').innerHTML = sortedRows.length ? `<table><thead><tr><th>تاریخ</th><th>نوع</th><th>زبان‌آموز</th><th>مبلغ</th><th>شرح</th></tr></thead><tbody>${sortedRows.slice(0,200).map(t=>{ const d = t.is_session && t.session_date ? t.session_date : t.date; return `<tr><td>${showDate(d)}</td><td>${typeTag(t.type,t.is_session,t.absent)}</td><td>${t.type==='expense'?'—':esc(stName(t.sid))}</td><td class="n"><b>${fa(t.amount)}</b></td><td style="white-space:normal;min-width:160px">${esc(t.desc)}</td></tr>`; }).join('')}</tbody></table>` : emptyState('تراکنشی نیست');
}

function openStatement(id){

/* =====================================================================
   UNDO
   ===================================================================== */
function pushUndo(type, data, message){
  undoBuffer.push({ ts: Date.now(), type, data });
  if(undoBuffer.length > 20) undoBuffer.shift();
  toast(message, 'info', { label: '↶ بازگردانی', fn: () => { if(!undoBuffer.length) return; restoreUndo(undoBuffer.pop()); } });
}
async function restoreUndo(undo){
  if(Date.now() - undo.ts > 60000){ toast('زمان گذشته', 'err'); return; }
  if(undo.type === 'tx-delete'){
    const t = undo.data;
    db.tx.push(t);
    await cloudInsert('tx', txToRow(t), t.id);
    saveLocal(); renderAll(); toast('بازگردانی شد', 'success');
  } else if(undo.type === 'st-delete'){
    const s = undo.data.student;
    const txs = undo.data.txs;
    db.students.push(s); txs.forEach(t => db.tx.push(t));
    await cloudInsert('students', studentToRow(s), s.id);
    for(const t of txs) await cloudInsert('tx', txToRow(t), t.id);
    saveLocal(); renderAll(); toast('بازگردانی شد', 'success');
  }
}

async function download(name, text, type){
  try{
    const blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
    toast('دانلود شد', 'success');
  }catch(e){ toast('خطا در ذخیره', 'err'); }
}

function applyPalette(pal){
  document.documentElement.dataset.palette = pal === 'gold' ? '' : pal;
  document.querySelectorAll('.palette-dot').forEach(d => d.classList.toggle('on', d.dataset.pal === pal));
}
document.querySelectorAll('.palette-dot').forEach(d => {
  d.onclick = () => {
    settings.palette = d.dataset.pal;
    applyPalette(settings.palette);
    saveSettings();
  };
});
$('compactToggle').onclick = () => {
  settings.compact = !settings.compact;
  document.body.classList.toggle('compact', settings.compact);
  $('compactToggle').textContent = settings.compact ? 'فعال' : 'غیرفعال';
  saveSettings();
};

$('themeBtn').onclick = () => {
  const r = document.documentElement;
  const isDark = r.dataset.theme === 'dark' || (r.dataset.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme = isDark ? 'light' : 'dark';
  try{ localStorage.setItem(CONFIG.LOCAL_KEY + '_theme', r.dataset.theme); }catch(e){}
};

/* =====================================================================
   NOTIFICATIONS
   ===================================================================== */
$('notifBtn').onclick = async () => {
  if(!('Notification' in window)){ toast('مرورگر پشتیبانی نمی‌کند', 'err'); return; }
  if(Notification.permission === 'granted'){ showTestNotification(); return; }
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){ toast('اعلان‌ها فعال شد', 'success'); showTestNotification(); }
  else toast('رد شد', 'err');
};
function showTestNotification(){
  const b = balances();
  const debtors = db.students.filter(s => b[s.id] && b[s.id].bal > 0);
  const todayBdays = db.students.filter(isBirthdayToday);
  if(debtors.length){
    new Notification('بدهکاران', { body: `${faDigits(debtors.length)} نفر بدهکار — مجموع ${fa(debtors.reduce((a,s)=>a+b[s.id].bal,0))} تومان` });
  }
  if(todayBdays.length){
    setTimeout(() => new Notification('🎂 تولد امروز', { body: `${todayBdays.map(s=>s.name).join('، ')}` }), 500);
  }
  if(!debtors.length && !todayBdays.length){
    new Notification('همه چیز مرتب', { body: 'بدهکاری و تولدی امروز نیست ✅' });
  }
}
function updateNotifBadge(){
  const b = balances();
  const count = db.students.filter(s => b[s.id] && b[s.id].bal > 0).length + db.students.filter(isBirthdayToday).length;
  const badge = $('notifBadge');
  if(count > 0){ badge.style.display = ''; badge.textContent = faDigits(count); }
  else badge.style.display = 'none';
}
function checkDailyNotif(){
  try{
    const last = +localStorage.getItem('ali_notif_last') || 0;
    const now = Date.now();
    if(now - last < 24 * 60 * 60 * 1000) return;
    if(Notification.permission !== 'granted') return;
    showTestNotification();
    localStorage.setItem('ali_notif_last', String(now));
  }catch(e){}
}

/* =====================================================================
   AUTO SYNC
   ===================================================================== */
let autoSyncTimer = null;
function startAutoSync(){
  if(autoSyncTimer) clearInterval(autoSyncTimer);
  autoSyncTimer = setInterval(async () => {
    if(!sb) return;
    if(syncQueue.length){ await flushQueue(); }
    if(Math.random() < 0.17){ const ok = await pullFromCloud(); if(ok) renderAll(); }
  }, 30000);
}

/* =====================================================================
   RENDER ALL
   ===================================================================== */
function renderAll(){
  renderCourseChips();
  renderSessionGrid();
  renderDash();
  renderStudents();
  renderSessions();
  renderTx();
  renderPkgs();
  renderCalendar();
  renderBirthdaysTab();
  renderAchievements();
  updateNotifBadge();
}

/* =====================================================================
   INIT
   ===================================================================== */
(async function init(){
  try{
    const th = localStorage.getItem(CONFIG.LOCAL_KEY + '_theme');
    if(th) document.documentElement.dataset.theme = th;
  }catch(e){}
  loadLocal();

  // apply saved settings
  applyPalette(settings.palette || 'gold');
  document.body.classList.toggle('compact', settings.compact);
  $('compactToggle').textContent = settings.compact ? 'فعال' : 'غیرفعال';

  const t = todayJ();
  $('todayTxt').textContent = longDate(dateStr(t));
  buildDate('txDate'); txTypeUI();
  buildDate('seDate');
  buildDate('stBirthday', null, true);
  buildDate('repFrom', [t[0], t[1], 1]);
  buildDate('repTo', t);
  initCalendar();
  renderAll();
  checkDailyNotif();
  startAutoSync();

  // splash
  const greeting = t[2] ? `امروز ${longDate(dateStr(t))}` : '';
  $('splashMsg').textContent = greeting;
  setTimeout(() => $('splash').classList.add('hide'), 1200);

  if(sb){
    setSync('syncing','اتصال…');
    await flushQueue();
    const ok = await pullFromCloud();
    if(ok) renderAll();
    if(syncQueue.length) setSync('offline', `صف: ${syncQueue.length}`);
  } else {
    setSync('offline','آفلاین');
  }
})();
</script>
